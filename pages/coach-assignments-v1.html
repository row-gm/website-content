<title>ROW Coaching Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #EEF3F8;
    --surface: #FFFFFF;
    --navy: #0C2340;
    --pool: #1A8FCF;
    --text: #0C1E30;
    --muted: #5A7A9A;
    --border: #C5D5E5;
    --assigned-bg: #1A8FCF;
    --assigned-tx: #fff;
    --avail-bg: #E4F5EC;
    --avail-bd: #27AE60;
    --avail-tx: #145E30;
    --blocked-bg: #FEF1E8;
    --blocked-bd: #D4660A;
    --blocked-tx: #7A3000;
    --inelig-bg: #F0F0F0;
    --inelig-tx: #999;
    --warn-bg: #FFF9E5;
    --warn-bd: #F9A825;
    --filled-bg: #E4F5EC;
    --filled-bd: #27AE60;
    --rock-stripe: #0C2340;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1520;
      --surface: #111E2C;
      --navy: #1A3A5C;
      --text: #D0E4F4;
      --muted: #7090A8;
      --border: #243648;
      --avail-bg: #0A2A18;
      --avail-bd: #27AE60;
      --avail-tx: #50D890;
      --blocked-bg: #2A1404;
      --blocked-bd: #D4660A;
      --blocked-tx: #F0A060;
      --inelig-bg: #151E28;
      --inelig-tx: #445566;
      --warn-bg: #222008;
      --warn-bd: #F9A825;
      --filled-bg: #0A2A18;
      --filled-bd: #27AE60;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1520;
    --surface: #111E2C;
    --navy: #1A3A5C;
    --text: #D0E4F4;
    --muted: #7090A8;
    --border: #243648;
    --avail-bg: #0A2A18;
    --avail-bd: #27AE60;
    --avail-tx: #50D890;
    --blocked-bg: #2A1404;
    --blocked-bd: #D4660A;
    --blocked-tx: #F0A060;
    --inelig-bg: #151E28;
    --inelig-tx: #445566;
    --warn-bg: #222008;
    --warn-bd: #F9A825;
    --filled-bg: #0A2A18;
    --filled-bd: #27AE60;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px 20px 40px; }

  .header { margin-bottom: 22px; }
  .header h1 { font-size: 1.15rem; font-weight: 700; color: var(--navy); }
  .header .sub { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }

  /* ── GROUP CARDS ── */
  .section-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
                   color: var(--muted); margin: 0 0 10px; }

  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; margin-bottom: 30px; }

  .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .group-card.filled { border-color: var(--filled-bd); }

  .card-top { display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px; border-bottom: 1px solid var(--border); }
  .priority-badge { font-size: 0.6rem; font-weight: 700; background: var(--navy); color: #fff;
                    border-radius: 3px; padding: 2px 5px; letter-spacing: 0.05em; flex-shrink: 0; }
  .group-name { font-weight: 700; font-size: 0.88rem; flex: 1; }
  .lanes-note { font-weight: 400; font-size: 0.75rem; color: var(--muted); margin-left: 4px; }
  .fill-status { font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; }
  .fill-status.open { background: var(--warn-bg); color: #8A6000; border: 1px solid var(--warn-bd); }
  .fill-status.done { background: var(--filled-bg); color: var(--avail-tx); border: 1px solid var(--filled-bd); }
  .fill-status.tentative { background: #FFF3CD; color: #7A5C00; border: 1px solid #E0A800; }
  :root[data-theme="dark"] .fill-status.tentative,
  :root:not([data-theme="light"]) .fill-status.tentative { background: #3A2E00; color: #FFD966; border-color: #E0A800; }
  .group-card.tentative { border-color: #E0A800; }

  .card-body { padding: 8px 12px 10px; }
  .schedule { font-size: 0.7rem; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
  .stack-note { font-size: 0.65rem; color: var(--avail-bd); font-weight: 600; margin-bottom: 6px; }

  .slots { display: flex; flex-wrap: wrap; gap: 4px; }
  .slot { font-size: 0.72rem; font-weight: 500; padding: 3px 8px; border-radius: 4px; border: 1px dashed var(--border); color: var(--muted); }
  .slot.filled-slot { background: var(--assigned-bg); color: var(--assigned-tx); border: none; border-radius: 4px; }

  /* ── MATRIX ── */
  .matrix-wrap { overflow-x: auto; border-radius: 8px; }
  table { border-collapse: collapse; min-width: 900px; width: 100%; background: var(--surface);
          border-radius: 8px; overflow: hidden; border: 1px solid var(--border); font-size: 0.72rem; }
  thead th { background: var(--navy); color: #fff; font-weight: 600; padding: 7px 8px;
             font-size: 0.65rem; letter-spacing: 0.04em; text-align: center; white-space: nowrap; border: none; }
  thead th.coach-col { text-align: left; padding-left: 12px; min-width: 90px; }
  tbody tr:nth-child(even) td { background: rgba(0,0,0,0.02); }
  tbody td { padding: 5px 6px; border: 1px solid var(--border); text-align: center; vertical-align: middle; }
  tbody td.coach-name { font-weight: 600; text-align: left; padding-left: 12px; color: var(--text); white-space: nowrap; }

  .cell { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: 600;
          letter-spacing: 0.02em; white-space: nowrap; }
  .cell.assigned { background: var(--assigned-bg); color: var(--assigned-tx); }
  .cell.available { background: var(--avail-bg); color: var(--avail-tx); border: 1px solid var(--avail-bd); }
  .cell.blocked  { background: var(--blocked-bg); color: var(--blocked-tx); border: 1px solid var(--blocked-bd); font-size: 0.58rem; }
  .cell.ineligible { background: var(--inelig-bg); color: var(--inelig-tx); }
  /* Closed columns (fully filled groups) */
  td.col-closed { background: var(--inelig-bg) !important; opacity: 0.5; }
  th.col-closed { opacity: 0.5; }
  /* Tentative columns */
  td.col-tentative { background: #FFFBEA !important; opacity: 0.7; }
  th.col-tentative { opacity: 0.8; color: #E0A800; }
  :root[data-theme="dark"] td.col-tentative,
  :root:not([data-theme="light"]) td.col-tentative { background: #2A2200 !important; }

  /* ── SCHEDULE BY COACH ── */
  .coach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 30px; }
  .coach-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .coach-card-top { background: var(--navy); color: #fff; padding: 8px 12px; }
  .coach-card-name { font-size: 0.9rem; font-weight: 700; }
  .coach-card-count { font-size: 0.65rem; font-weight: 500; opacity: 0.7; margin-top: 1px; }
  .coach-card-body { padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 7px; }
  .coach-group-row { display: flex; flex-direction: column; gap: 2px; }
  .coach-group-label { display: flex; align-items: center; gap: 6px; }
  .coach-group-name { font-size: 0.78rem; font-weight: 700; color: var(--pool); }
  .coach-group-schedule { font-size: 0.67rem; color: var(--muted); line-height: 1.4; }
  .coach-group-divider { border: none; border-top: 1px solid var(--border); margin: 0; }

  /* ── LEGEND ── */
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 14px; font-size: 0.7rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .ls { width: 28px; height: 14px; border-radius: 3px; border: 1px solid; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 700; color: #fff; }
  .ls.assigned  { background: var(--assigned-bg); border-color: var(--assigned-bg); }
  .ls.available { background: var(--avail-bg); border-color: var(--avail-bd); color: var(--avail-tx); }
  .ls.blocked   { background: var(--blocked-bg); border-color: var(--blocked-bd); color: var(--blocked-tx); }
  .ls.inelig    { background: var(--inelig-bg); border-color: var(--border); color: var(--inelig-tx); }
</style>

<div class="header">
  <h1>ROW Swim Club — 2026–27 Coaching Tracker</h1>
  <p class="sub">Big rocks first · All slots open — assign groups in order from top to bottom</p>
</div>

<p class="section-title">Groups — priority order</p>
<div class="groups" id="groups"></div>

<p class="section-title">Schedule by coach</p>
<div class="coach-grid" id="coach-schedule"></div>

<p class="section-title">Coach availability matrix</p>
<div class="legend">
  <div class="legend-item"><div class="ls assigned">✓</div> Assigned</div>
  <div class="legend-item"><div class="ls available">✓</div> Available</div>
  <div class="legend-item"><div class="ls blocked">!</div> Blocked by conflict</div>
  <div class="legend-item"><div class="ls inelig">–</div> Not eligible</div>
</div>
<div class="matrix-wrap">
  <table id="matrix"></table>
</div>

<script>
const DATA = {"groups":[{"name":"AGD 1","required":3,"schedule":"Mon CH 5:30–7 pm · Tue RC 6–7:30 am · Wed/Thu WLU-D 7–8 pm · Sat CH 6–7:30 am","note":"","lanes":6},{"name":"AGD 2","required":3,"schedule":"Mon WLU 6–7:30 am · Tue WLU-D 7–8:30 pm · Thu RC 6–7:30 am · Fri WLU 7:30–8:30 pm","note":"","lanes":6},{"name":"JD 1","required":3,"schedule":"Tue 7:00–8:30 pm · Thu 6:00–7:30 am · Fri 6:30–8:00 pm · Sat 9:00–10:30 am — WLU","note":"","lanes":3},{"name":"JD 2","required":2,"schedule":"Mon WLU 6:30–8 pm · Wed WLU 6–7:30 pm · Thu WLU 5:30–7 pm","note":"","lanes":3},{"name":"Rec PM","required":2,"schedule":"Mon / Wed / Fri — CH 8–9 pm","note":"","lanes":6},{"name":"TOPS 1-1","required":2,"schedule":"Mon / Wed / Fri — CH 7–8 pm","note":"Drew: Mon+Fri only","lanes":3},{"name":"TOPS 1-2","required":2,"schedule":"Tue WLU-S 7:30–8:30 pm · Wed WLU-S 6:30–7:30 pm · Thu WLU-S 7–8 pm","note":"","lanes":3},{"name":"TOPS 2-1","required":1,"schedule":"Mon / Wed — CH 7–8 pm","note":"","lanes":1},{"name":"TOPS 2-2","required":1,"schedule":"Wed / Fri — CH 7–8 pm","note":"","lanes":1},{"name":"TOPS 2-3","required":1,"schedule":"Mon / Fri — CH 7–8 pm","note":"","lanes":1},{"name":"TOPS 2-4","required":3,"schedule":"Tue / Thu — WLU Pool S 5:30–6:30 pm","note":"Stacks with TOPS 2-5","lanes":3},{"name":"TOPS 2-5","required":3,"schedule":"Tue / Thu — WLU Pool S 6:30–7:30 pm","note":"Stacks with TOPS 2-4","lanes":3},{"name":"RSA","required":7,"schedule":"Saturday — CH 7:30–10 am","note":"","lanes":6}],"coaches":["Allison","Anna","Connor","Devin","Drew","Edward","Elan","Elise","Gabby","Inderpreet","Ksenia","Oliver","Patrick","Sebastian","Trystan","Tysen","Violet"],"assignments":{"AGD 2":["Ksenia","Trystan","Connor"],"AGD 1":["Ksenia","Trystan","Connor"],"JD 1":["Sebastian","Oliver","Violet"],"JD 2":["Allison","Elise","Tysen"],"TOPS 1-1":["Gabby","Patrick","Drew"],"TOPS 1-2":["Drew","Devin"],"TOPS 2-1":["Edward"],"TOPS 2-2":["Inderpreet"],"TOPS 2-3":["Devin"],"TOPS 2-4":["Elan","Gabby","Edward"],"TOPS 2-5":["Elan","Gabby","Edward"],"RSA":["Devin","Ksenia","Trystan","Edward","Gabby","Inderpreet","Connor","Violet","Anna"],"Rec PM":["Gabby","Patrick"]},"tentative":[],"matrix":{"Allison":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"assigned","Rec PM":"ineligible","TOPS 1-1":"ineligible","TOPS 1-2":"blocked:JD 2","TOPS 2-1":"ineligible","TOPS 2-2":"ineligible","TOPS 2-3":"blocked:JD 2","TOPS 2-4":"blocked:JD 2","TOPS 2-5":"blocked:JD 2","RSA":"ineligible"},"Anna":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"ineligible","Rec PM":"ineligible","TOPS 1-1":"ineligible","TOPS 1-2":"ineligible","TOPS 2-1":"available","TOPS 2-2":"ineligible","TOPS 2-3":"ineligible","TOPS 2-4":"ineligible","TOPS 2-5":"ineligible","RSA":"assigned"},"Connor":{"AGD 1":"assigned","AGD 2":"assigned","JD 1":"ineligible","JD 2":"ineligible","Rec PM":"blocked:AGD 2,AGD 1","TOPS 1-1":"blocked:AGD 2,AGD 1","TOPS 1-2":"ineligible","TOPS 2-1":"blocked:AGD 1","TOPS 2-2":"blocked:AGD 2,AGD 1","TOPS 2-3":"blocked:AGD 2","TOPS 2-4":"ineligible","TOPS 2-5":"ineligible","RSA":"assigned"},"Devin":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"blocked:TOPS 1-2,TOPS 2-3","Rec PM":"blocked:TOPS 1-2","TOPS 1-1":"blocked:TOPS 1-2,TOPS 2-3","TOPS 1-2":"assigned","TOPS 2-1":"blocked:TOPS 1-2,TOPS 2-3","TOPS 2-2":"blocked:TOPS 1-2,TOPS 2-3","TOPS 2-3":"assigned","TOPS 2-4":"ineligible","TOPS 2-5":"blocked:TOPS 1-2","RSA":"assigned"},"Drew":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"ineligible","Rec PM":"ineligible","TOPS 1-1":"assigned","TOPS 1-2":"assigned","TOPS 2-1":"blocked:TOPS 1-1,TOPS 1-2","TOPS 2-2":"blocked:TOPS 1-1,TOPS 1-2","TOPS 2-3":"blocked:TOPS 1-1","TOPS 2-4":"ineligible","TOPS 2-5":"ineligible","RSA":"ineligible"},"Edward":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"ineligible","Rec PM":"ineligible","TOPS 1-1":"ineligible","TOPS 1-2":"blocked:TOPS 2-1,TOPS 2-5","TOPS 2-1":"assigned","TOPS 2-2":"ineligible","TOPS 2-3":"ineligible","TOPS 2-4":"assigned","TOPS 2-5":"assigned","RSA":"assigned"},"Elan":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"ineligible","Rec PM":"ineligible","TOPS 1-1":"ineligible","TOPS 1-2":"ineligible","TOPS 2-1":"ineligible","TOPS 2-2":"ineligible","TOPS 2-3":"ineligible","TOPS 2-4":"assigned","TOPS 2-5":"assigned","RSA":"ineligible"},"Elise":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"assigned","Rec PM":"ineligible","TOPS 1-1":"ineligible","TOPS 1-2":"ineligible","TOPS 2-1":"blocked:JD 2","TOPS 2-2":"ineligible","TOPS 2-3":"ineligible","TOPS 2-4":"ineligible","TOPS 2-5":"ineligible","RSA":"ineligible"},"Gabby":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"blocked:TOPS 1-1,TOPS 2-4,TOPS 2-5,Rec PM","Rec PM":"assigned","TOPS 1-1":"assigned","TOPS 1-2":"ineligible","TOPS 2-1":"blocked:TOPS 1-1","TOPS 2-2":"blocked:TOPS 1-1","TOPS 2-3":"blocked:TOPS 1-1","TOPS 2-4":"assigned","TOPS 2-5":"assigned","RSA":"assigned"},"Inderpreet":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"blocked:TOPS 2-2","Rec PM":"ineligible","TOPS 1-1":"blocked:TOPS 2-2","TOPS 1-2":"blocked:TOPS 2-2","TOPS 2-1":"blocked:TOPS 2-2","TOPS 2-2":"assigned","TOPS 2-3":"blocked:TOPS 2-2","TOPS 2-4":"available","TOPS 2-5":"available","RSA":"assigned"},"Ksenia":{"AGD 1":"assigned","AGD 2":"assigned","JD 1":"ineligible","JD 2":"ineligible","Rec PM":"blocked:AGD 2,AGD 1","TOPS 1-1":"blocked:AGD 2,AGD 1","TOPS 1-2":"blocked:AGD 2,AGD 1","TOPS 2-1":"blocked:AGD 1","TOPS 2-2":"blocked:AGD 2,AGD 1","TOPS 2-3":"blocked:AGD 2","TOPS 2-4":"ineligible","TOPS 2-5":"blocked:AGD 2","RSA":"assigned"},"Oliver":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"assigned","JD 2":"ineligible","Rec PM":"ineligible","TOPS 1-1":"ineligible","TOPS 1-2":"ineligible","TOPS 2-1":"ineligible","TOPS 2-2":"ineligible","TOPS 2-3":"ineligible","TOPS 2-4":"ineligible","TOPS 2-5":"blocked:JD 1","RSA":"ineligible"},"Patrick":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"ineligible","Rec PM":"assigned","TOPS 1-1":"assigned","TOPS 1-2":"blocked:TOPS 1-1,Rec PM","TOPS 2-1":"blocked:TOPS 1-1","TOPS 2-2":"blocked:TOPS 1-1","TOPS 2-3":"blocked:TOPS 1-1","TOPS 2-4":"ineligible","TOPS 2-5":"available","RSA":"ineligible"},"Sebastian":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"assigned","JD 2":"ineligible","Rec PM":"available","TOPS 1-1":"ineligible","TOPS 1-2":"ineligible","TOPS 2-1":"ineligible","TOPS 2-2":"ineligible","TOPS 2-3":"ineligible","TOPS 2-4":"ineligible","TOPS 2-5":"ineligible","RSA":"ineligible"},"Trystan":{"AGD 1":"assigned","AGD 2":"assigned","JD 1":"ineligible","JD 2":"blocked:AGD 1","Rec PM":"blocked:AGD 2,AGD 1","TOPS 1-1":"blocked:AGD 2,AGD 1","TOPS 1-2":"blocked:AGD 2,AGD 1","TOPS 2-1":"blocked:AGD 1","TOPS 2-2":"blocked:AGD 2,AGD 1","TOPS 2-3":"blocked:AGD 2","TOPS 2-4":"available","TOPS 2-5":"blocked:AGD 2","RSA":"assigned"},"Tysen":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"ineligible","JD 2":"assigned","Rec PM":"ineligible","TOPS 1-1":"ineligible","TOPS 1-2":"ineligible","TOPS 2-1":"blocked:JD 2","TOPS 2-2":"ineligible","TOPS 2-3":"ineligible","TOPS 2-4":"ineligible","TOPS 2-5":"ineligible","RSA":"ineligible"},"Violet":{"AGD 1":"ineligible","AGD 2":"ineligible","JD 1":"assigned","JD 2":"ineligible","Rec PM":"ineligible","TOPS 1-1":"ineligible","TOPS 1-2":"ineligible","TOPS 2-1":"ineligible","TOPS 2-2":"ineligible","TOPS 2-3":"available","TOPS 2-4":"ineligible","TOPS 2-5":"blocked:JD 1","RSA":"assigned"}}};

// ── RENDER GROUP CARDS ──────────────────────────────────────────────────────
const groupsEl = document.getElementById('groups');
const tentativeGroups = new Set(DATA.tentative || []);

DATA.groups.forEach((g, i) => {
  const assigned = DATA.assignments[g.name] || [];
  const filled = assigned.filter(Boolean).length;
  const done = filled >= g.required;
  const tentative = done && tentativeGroups.has(g.name);

  const card = document.createElement('div');
  card.className = 'group-card' + (tentative ? ' tentative' : done ? ' filled' : '');

  const slots = Array.from({length: Math.max(g.required, assigned.length)}, (_, si) => {
    const coach = assigned[si];
    if (coach) return `<span class="slot filled-slot">${coach}</span>`;
    return `<span class="slot">open</span>`;
  }).join('');

  const stackNote = g.note ? `<div class="stack-note">⟳ ${g.note}</div>` : '';
  const statusClass = tentative ? 'tentative' : done ? 'done' : 'open';
  const statusLabel = tentative ? `${filled}/3 Tentative` : `${filled}/${g.required}`;

  card.innerHTML = `
    <div class="card-top">
      <span class="priority-badge">#${i+1}</span>
      <span class="group-name">${g.name}<span class="lanes-note">(${g.lanes} lanes)</span></span>
      <span class="fill-status ${statusClass}">${statusLabel}</span>
    </div>
    <div class="card-body">
      <div class="schedule">${g.schedule}</div>
      ${stackNote}
      <div class="slots">${slots}</div>
    </div>`;
  groupsEl.appendChild(card);
});

// ── RENDER SCHEDULE BY COACH ─────────────────────────────────────────────────
const coachScheduleEl = document.getElementById('coach-schedule');

// Coach-specific schedule overrides (coach → group name → custom schedule)
const SCHEDULE_OVERRIDES = {
  'Violet': { 'JD 1': 'Tue 7:00–8:30 pm · Thu 6:00–7:30 am · Fri 6:30–8:00 pm' },
  'Drew':   { 'TOPS 1-1': 'Mon / Fri — CH 7–8 pm' },
};

// Build coach → groups map
const coachGroups = {};
DATA.groups.forEach(g => {
  const assigned = DATA.assignments[g.name] || [];
  assigned.forEach(coach => {
    if (!coach) return;
    if (!coachGroups[coach]) coachGroups[coach] = [];
    coachGroups[coach].push(g);
  });
});

// Render a card per coach who has assignments, in alphabetical order
DATA.coaches.forEach(coach => {
  const groups = coachGroups[coach];
  if (!groups || groups.length === 0) return;

  const card = document.createElement('div');
  card.className = 'coach-card';

  const groupCount = groups.length;
  const noun = groupCount === 1 ? 'group' : 'groups';

  const rows = groups.map((g, idx) => {
    const divider = idx < groups.length - 1 ? '<hr class="coach-group-divider">' : '';
    return `
      <div class="coach-group-row">
        <div class="coach-group-label">
          <span class="coach-group-name">${g.name}</span>
        </div>
        <div class="coach-group-schedule">${((SCHEDULE_OVERRIDES[coach] && SCHEDULE_OVERRIDES[coach][g.name]) || g.schedule).split(' · ').join('<br>')}${g.name === 'RSA' && ['Connor','Ksenia','Trystan'].includes(coach) ? '<br><em>(Rotating Supervisor)</em>' : ''}</div>
      </div>
      ${divider}`;
  }).join('');

  card.innerHTML = `
    <div class="coach-card-top">
      <div class="coach-card-name">${coach}</div>
      <div class="coach-card-count">${groupCount} ${noun}</div>
    </div>
    <div class="coach-card-body">${rows}</div>`;

  coachScheduleEl.appendChild(card);
});

// ── RENDER MATRIX ────────────────────────────────────────────────────────────
const table = document.getElementById('matrix');
const groupNames = DATA.groups.map(g => g.name);

// Which groups are fully filled?
const closedGroups = new Set(
  DATA.groups
    .filter(g => (DATA.assignments[g.name] || []).filter(Boolean).length >= g.required)
    .map(g => g.name)
);

// Header
const thead = document.createElement('thead');
let hrow = '<tr><th class="coach-col">Coach</th>';
groupNames.forEach(gn => {
  const closed = closedGroups.has(gn);
  const tent = tentativeGroups.has(gn);
  const cls = closed ? (tent ? 'col-tentative' : 'col-closed') : '';
  const mark = tent ? ' ~' : closed ? ' ✓' : '';
  hrow += `<th class="${cls}">${gn}${mark}</th>`;
});
hrow += '</tr>';
thead.innerHTML = hrow;
table.appendChild(thead);

// Body
const tbody = document.createElement('tbody');
DATA.coaches.forEach(coach => {
  const tr = document.createElement('tr');
  let html = `<td class="coach-name">${coach}</td>`;
  groupNames.forEach(gn => {
    const closed = closedGroups.has(gn);
    const s = DATA.matrix[coach][gn];
    let label, cls;
    if (s === 'assigned')    { cls = 'assigned';    label = '✓'; }
    else if (s === 'available')  { cls = 'available';   label = '✓'; }
    else if (s.startsWith('blocked')) {
      cls = 'blocked';
      const by = s.replace('blocked:', '');
      label = by;
    }
    else { cls = 'ineligible'; label = '–'; }
    // For closed columns, dim non-assigned; tentative columns get lighter dimming
    const tent = tentativeGroups.has(gn);
    if (closed && !tent && cls !== 'assigned') {
      html += `<td class="col-closed"></td>`;
    } else if (tent && cls !== 'assigned') {
      html += `<td class="col-tentative"></td>`;
    } else {
      html += `<td><span class="cell ${cls}">${label}</span></td>`;
    }
  });
  tr.innerHTML = html;
  tbody.appendChild(tr);
});
table.appendChild(tbody);
</script>
