<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #EEF3F8;
    --surface: #FFFFFF;
    --navy: #0C2340;
    --pool: #1A8FCF;
    --text: #0C1E30;
    --muted: #5A7A9A;
    --border: #C5D5E5;
    --assigned-bg: #1A8FCF;
    --assigned-tx: #fff;
    --avail-bg: #E4F5EC;
    --avail-bd: #27AE60;
    --avail-tx: #145E30;
    --blocked-bg: #FEF1E8;
    --blocked-bd: #D4660A;
    --blocked-tx: #7A3000;
    --inelig-bg: #F0F0F0;
    --inelig-tx: #999;
    --warn-bg: #FFF9E5;
    --warn-bd: #F9A825;
    --warn-tx: #8A6000;
    --filled-bg: #E4F5EC;
    --filled-bd: #27AE60;
    --rock-stripe: #0C2340;
  }
  /* Single dark block — applied via JS class, not CSS media query */
  html.dark {
    --bg: #2C3E52;
    --surface: #374F66;
    --navy: #1E4878;
    --pool: #5BC8EF;
    --text: #D0E4F4;
    --muted: #A8C4D8;
    --border: #3A5470;
    --assigned-bg: #1E88C8;
    --avail-bg: #0A2A18;
    --avail-bd: #27AE60;
    --avail-tx: #50D890;
    --blocked-bg: #2A1404;
    --blocked-bd: #D4660A;
    --blocked-tx: #F0A060;
    --inelig-bg: #1E2D3E;
    --inelig-tx: #4A6078;
    --warn-bg: #2A2200;
    --warn-bd: #F9A825;
    --warn-tx: #F0C040;
    --filled-bg: #0A2A18;
    --filled-bd: #27AE60;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px 20px 40px; }

  .header { margin-bottom: 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .header-text h1 { font-size: 1.15rem; font-weight: 700; color: var(--text); }
  .header-text .sub { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
  .theme-toggle { flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
                  padding: 5px 9px; cursor: pointer; font-size: 0.85rem; color: var(--muted);
                  display: flex; align-items: center; gap: 5px; transition: background 0.15s; }
  .theme-toggle:hover { background: var(--border); }

  /* ── GROUP CARDS ── */
  .section-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
                   color: var(--muted); margin: 0 0 10px; }

  .groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; margin-bottom: 30px; }

  .group-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .group-card.filled { border-color: var(--filled-bd); }

  .card-top { display: flex; align-items: center; gap: 8px; padding: 9px 12px 7px; border-bottom: 1px solid var(--border); }
  .priority-badge { font-size: 0.6rem; font-weight: 700; background: var(--navy); color: #fff;
                    border-radius: 3px; padding: 2px 5px; letter-spacing: 0.05em; flex-shrink: 0; }
  .group-name { font-weight: 700; font-size: 0.88rem; flex: 1; }
  .lanes-note { font-weight: 400; font-size: 0.75rem; color: var(--muted); margin-left: 4px; }
  .fill-status { font-size: 0.7rem; font-weight: 700; padding: 2px 7px; border-radius: 10px; flex-shrink: 0; }
  .fill-status.open { background: var(--warn-bg); color: var(--warn-tx); border: 1px solid var(--warn-bd); }
  .fill-status.done { background: var(--filled-bg); color: var(--avail-tx); border: 1px solid var(--filled-bd); }
  .fill-status.tentative { background: #FFF3CD; color: #7A5C00; border: 1px solid #E0A800; }
  html.dark .fill-status.tentative { background: #3A2E00; color: #FFD966; border-color: #E0A800; }
  .group-card.tentative { border-color: #E0A800; }
  .slot.supervisor-slot { background: #DDEEFF; color: #1A4A7A; border: 1px solid #6AAAD4; border-radius: 4px; }
  html.dark .slot.supervisor-slot { background: #0A1E33; color: #80C4E8; border-color: #2A6A9A; }

  .card-body { padding: 8px 12px 10px; }
  .schedule { font-size: 0.7rem; color: var(--muted); margin-bottom: 6px; line-height: 1.5; }
  .stack-note { font-size: 0.65rem; color: var(--avail-bd); font-weight: 600; margin-bottom: 6px; }

  .slots { display: flex; flex-wrap: wrap; gap: 4px; }
  .slot { font-size: 0.72rem; font-weight: 500; padding: 3px 8px; border-radius: 4px; border: 1px dashed var(--border); color: var(--muted); }
  .slot.filled-slot { background: var(--assigned-bg); color: var(--assigned-tx); border: none; border-radius: 4px; }
  .slot.volunteer-slot { background: #E8E0F0; color: #5A3A7A; border: 1px solid #B094CC; border-radius: 4px; }
  html.dark .slot.volunteer-slot { background: #2E1A44; color: #C4A0E8; border-color: #7A50A8; }

  /* ── MATRIX ── */
  .matrix-wrap { overflow-x: auto; border-radius: 8px; }
  table { border-collapse: collapse; min-width: 900px; width: 100%; background: var(--surface);
          border-radius: 8px; overflow: hidden; border: 1px solid var(--border); font-size: 0.72rem; }
  thead th { background: var(--navy); color: #fff; font-weight: 600; padding: 7px 8px;
             font-size: 0.65rem; letter-spacing: 0.04em; text-align: center; white-space: nowrap; border: none; }
  thead th.coach-col { text-align: left; padding-left: 12px; min-width: 90px; }
  tbody tr:nth-child(even) td { background: rgba(0,0,0,0.04); }
  html.dark tbody tr:nth-child(even) td { background: rgba(255,255,255,0.06); }
  html.dark .cell.partial { background: #2C1F00; color: #F5C842; border-color: #A07800; }
  tbody td { padding: 5px 6px; border: 1px solid var(--border); text-align: center; vertical-align: middle; }
  tbody td.coach-name { font-weight: 600; text-align: left; padding-left: 12px; color: var(--text); white-space: nowrap; }

  .cell { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 0.65rem; font-weight: 600;
          letter-spacing: 0.02em; white-space: nowrap; }
  .cell.assigned  { background: var(--assigned-bg); color: #fff; }
  .cell.available { background: #B8C4CC; color: #1A2A3A; border: none; }
  .cell.partial   { background: #FEF3C7; color: #78450A; border: 1px solid #F5C842; }
  .cell.blocked   { background: var(--blocked-bg); color: var(--blocked-tx); border: 1px solid var(--blocked-bd); font-size: 0.58rem; }
  .cell.ineligible { background: var(--inelig-bg); color: var(--inelig-tx); }
  /* Closed / tentative columns — TDs plain so row stripe is uniform */
  td.col-closed, td.col-tentative { /* no special background or opacity */ }
  th.col-tentative { color: #E0A800; }

  /* ── SCHEDULE BY COACH ── */
  .coach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 30px; }
  .coach-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .coach-card-top { background: var(--navy); color: #fff; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .coach-card-name { font-size: 0.9rem; font-weight: 700; }
  .coach-card-count { font-size: 0.65rem; font-weight: 500; opacity: 0.7; margin-top: 1px; }
  .hours-chip { flex-shrink: 0; background: rgba(255,255,255,0.15); color: #fff; font-size: 0.65rem;
               font-weight: 600; padding: 2px 7px; border-radius: 10px; letter-spacing: 0.02em; }
  .coach-card-body { padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 7px; }
  .coach-group-row { display: flex; flex-direction: column; gap: 2px; }
  .coach-group-label { display: flex; align-items: center; gap: 6px; }
  .coach-group-name { font-size: 0.78rem; font-weight: 700; color: var(--pool); }
  .coach-group-schedule { font-size: 0.67rem; color: var(--muted); line-height: 1.4; }
  .coach-group-divider { border: none; border-top: 1px solid var(--border); margin: 0; }

  /* ── LEGEND ── */
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 14px; font-size: 0.7rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .ls { width: 28px; height: 14px; border-radius: 3px; border: 1px solid; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.55rem; font-weight: 700; color: #fff; }
  .ls.assigned  { background: var(--assigned-bg); border-color: var(--assigned-bg); color: #fff; }
  .ls.available { background: #B8C4CC; border-color: #B8C4CC; color: #1A2A3A; }
  .ls.partial   { background: #FEF3C7; border-color: #F5C842; color: #78450A; }
  .ls.blocked   { background: var(--blocked-bg); border-color: var(--blocked-bd); color: var(--blocked-tx); }
  .ls.inelig    { background: var(--inelig-bg); border-color: var(--border); color: var(--inelig-tx); }
</style>

<script>
(function () {
  var STORAGE_KEY = 'row-tracker-theme';

  function getSystemDark() {
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function applyTheme() {
    var stored = localStorage.getItem(STORAGE_KEY);
    var isDark = stored === 'dark' || (stored !== 'light' && getSystemDark());
    document.documentElement.classList.toggle('dark', isDark);
    var btn = document.getElementById('theme-toggle-btn');
    if (btn) btn.textContent = isDark ? '☀ Light' : '☾ Dark';
  }

  window._toggleTheme = function () {
    var stored = localStorage.getItem(STORAGE_KEY);
    var isDark = stored === 'dark' || (stored !== 'light' && getSystemDark());
    localStorage.setItem(STORAGE_KEY, isDark ? 'light' : 'dark');
    applyTheme();
  };

  applyTheme();
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  }
})();
</script>

// ── RENDER GROUP CARDS ──────────────────────────────────────────────────────
const groupsEl = document.getElementById('groups');
const tentativeGroups = new Set(DATA.tentative || []);

DATA.groups.forEach((g, i) => {
  const assigned = DATA.assignments[g.name] || [];
  const filled = assigned.filter(Boolean).length;
  const done = filled >= g.required;
  const tentative = done && tentativeGroups.has(g.name);

  const card = document.createElement('div');
  card.className = 'group-card' + (tentative ? ' tentative' : done ? ' filled' : '');

  const groupVolunteers = (DATA.volunteers && DATA.volunteers[g.name]) || [];
  const groupSupervisors = (DATA.supervisors && DATA.supervisors[g.name]) || [];
  const slots = Array.from({length: Math.max(g.required, assigned.length)}, (_, si) => {
    const coach = assigned[si];
    if (coach) {
      const cls = groupVolunteers.includes(coach) ? 'volunteer-slot'
                : groupSupervisors.includes(coach) ? 'supervisor-slot'
                : 'filled-slot';
      return `<span class="slot ${cls}">${coach}</span>`;
    }
    return `<span class="slot">open</span>`;
  }).join('');

  const stackNote = g.note ? `<div class="stack-note">⟳ ${g.note}</div>` : '';
  const statusClass = tentative ? 'tentative' : done ? 'done' : 'open';
  const statusLabel = tentative ? `${filled} coaches · tentative` : `${filled} coaches`;
  const supervisorChip = g.tag ? `<span class="slot supervisor-slot">${g.tag}</span>` : '';

  card.innerHTML = `
    <div class="card-top">
      <span class="priority-badge">#${i+1}</span>
      <span class="group-name">${g.name}<span class="lanes-note">(${g.lanes} ${g.lanes === 1 ? 'lane' : 'lanes'})</span></span>
      <span class="fill-status ${statusClass}">${statusLabel}</span>
    </div>
    <div class="card-body">
      <div class="schedule">${g.schedule.split(' · ').join('<br>')}</div>
      ${stackNote}
      <div class="slots">${slots}${supervisorChip}</div>
    </div>`;
  groupsEl.appendChild(card);
});

// ── RENDER SCHEDULE BY COACH ─────────────────────────────────────────────────
const coachScheduleEl = document.getElementById('coach-schedule');

// Coach-specific schedule overrides (coach → group name → custom schedule)
const SCHEDULE_OVERRIDES = {
  'Violet':  { 'JD 1':         'Tue - WLU - 7:00–8:30 pm · Thu - WLU - 6:00–7:30 am · Fri - WLU - 6:30–8:00 pm' },
  'Drew':    { 'TOPS 1-1':     'Mon - CH - 7–8 pm · Fri - CH - 7–8 pm' },
  'Trystan': { 'SD Assistant': 'Tue - WLU - 4–6:30 pm · Wed - WLU - 5–7 pm · Thu - WLU - 4–6 pm · Fri - WLU - 4:30–6 pm · Sat - WLU - 6–8:30 am' },
};

// Build coach → groups map
const coachGroups = {};
DATA.groups.forEach(g => {
  const assigned = DATA.assignments[g.name] || [];
  assigned.forEach(coach => {
    if (!coach) return;
    if (!coachGroups[coach]) coachGroups[coach] = [];
    coachGroups[coach].push(g);
  });
});

// Build hours lookup: coach name → total_hours
const hoursMap = {};
(DATA.coaches_detail || []).forEach(cd => { hoursMap[cd.coach] = cd.total_hours; });

// Render a card per coach who has assignments, in alphabetical order
const hideFromSchedule = new Set(DATA.hide_from_schedule || []);
DATA.coaches.forEach(coach => {
  if (hideFromSchedule.has(coach)) return;
  const groups = coachGroups[coach];
  if (!groups || groups.length === 0) return;

  const card = document.createElement('div');
  card.className = 'coach-card';

  const groupCount = groups.length;
  const noun = groupCount === 1 ? 'group' : 'groups';

  const rows = groups.map((g, idx) => {
    const divider = idx < groups.length - 1 ? '<hr class="coach-group-divider">' : '';
    return `
      <div class="coach-group-row">
        <div class="coach-group-label">
          <span class="coach-group-name">${g.name}</span>
        </div>
        <div class="coach-group-schedule">${((SCHEDULE_OVERRIDES[coach] && SCHEDULE_OVERRIDES[coach][g.name]) || g.schedule).split(' · ').join('<br>')}${g.name === 'RSA' && ['Ksenia','Trystan'].includes(coach) ? '<br><em>(Supervisor)</em>' : ''}</div>
      </div>
      ${divider}`;
  }).join('');

  const totalHrs = hoursMap[coach];
  const hrsChip = totalHrs != null ? `<span class="hours-chip">${Number.isInteger(totalHrs) ? totalHrs : totalHrs.toFixed(1)} hrs</span>` : '';

  card.innerHTML = `
    <div class="coach-card-top">
      <div>
        <div class="coach-card-name">${coach}</div>
        <div class="coach-card-count">${groupCount} ${noun}</div>
      </div>
      ${hrsChip}
    </div>
    <div class="coach-card-body">${rows}</div>`;

  coachScheduleEl.appendChild(card);
});
