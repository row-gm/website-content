<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ROW Card Check-In</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
  <style>
  :root {
    --bg:       #EAF3FC;
    --surface:  #FFFFFF;
    --border:   #C2D9EE;
    --text:     #0C1E30;
    --muted:    #5A7890;
    --accent:   #1676C2;
    --accent-h: #1260A4;

    --msg-yes-bg:   #E6F5EE; --msg-yes-bd:   #9ECFB2; --msg-yes-tx:   #124C2C;
    --msg-warn-bg:  #FEF4E4; --msg-warn-bd:  #F0C276; --msg-warn-tx:  #78410A;
    --msg-blue-bg:  #E4EFFD; --msg-blue-bd:  #9AB8F0; --msg-blue-tx:  #1B3478;
    --msg-grey-bg:  #F2F5F8; --msg-grey-bd:  #C8D4E0; --msg-grey-tx:  #3C4F62;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:       #081524;
      --surface:  #0E2030;
      --border:   #193450;
      --text:     #DCEEFA;
      --muted:    #6898B8;
      --accent:   #48A6DE;
      --accent-h: #5BB4E8;

      --msg-yes-bg:   #092A18; --msg-yes-bd:   #185A34; --msg-yes-tx:   #6EDAA0;
      --msg-warn-bg:  #281A07; --msg-warn-bd:  #7A4B10; --msg-warn-tx:  #F5C87A;
      --msg-blue-bg:  #0B1C44; --msg-blue-bd:  #253880; --msg-blue-tx:  #A4B8F8;
      --msg-grey-bg:  #131E2C; --msg-grey-bd:  #28394E; --msg-grey-tx:  #90A8BC;
    }
  }
  :root[data-theme="dark"] {
    --bg:       #081524;
    --surface:  #0E2030;
    --border:   #193450;
    --text:     #DCEEFA;
    --muted:    #6898B8;
    --accent:   #48A6DE;
    --accent-h: #5BB4E8;

    --msg-yes-bg:   #092A18; --msg-yes-bd:   #185A34; --msg-yes-tx:   #6EDAA0;
    --msg-warn-bg:  #281A07; --msg-warn-bd:  #7A4B10; --msg-warn-tx:  #F5C87A;
    --msg-blue-bg:  #0B1C44; --msg-blue-bd:  #253880; --msg-blue-tx:  #A4B8F8;
    --msg-grey-bg:  #131E2C; --msg-grey-bd:  #28394E; --msg-grey-tx:  #90A8BC;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: 'Nunito Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 28px 16px 40px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .wrap {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 24px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .club-name {
    font-size: 12px; font-weight: 800;
    color: var(--text); letter-spacing: 0.07em;
    text-transform: uppercase; line-height: 1.2;
  }
  .club-sub { font-size: 11px; color: var(--muted); font-weight: 400; }

  /* ── Greeting ── */
  .greeting {
    font-size: 21px; font-weight: 800;
    margin: 0 0 8px; line-height: 1.3;
    text-wrap: balance;
  }
  .context {
    font-size: 14px; color: var(--muted);
    line-height: 1.65; margin: 0 0 20px;
  }

  /* ── Card list ── */
  .cards-box {
    background: var(--bg);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 0 0 22px;
  }
  .cards-label {
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .card-row {
    display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
    padding: 5px 0;
  }
  .card-row + .card-row {
    border-top: 1px solid var(--border);
    margin-top: 5px; padding-top: 10px;
  }
  .swimmer { font-size: 14px; font-weight: 600; }
  .cid {
    font-family: 'Courier New', monospace;
    font-size: 12px; font-weight: 700;
    color: var(--accent);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── Question ── */
  .question {
    font-size: 16px; font-weight: 700;
    margin: 0 0 16px; line-height: 1.4;
  }
  .btn-row { display: flex; gap: 10px; }
  .btn {
    flex: 1; padding: 13px 14px;
    border-radius: 10px; border: 2px solid;
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all 0.12s ease;
    text-align: center;
  }
  .btn-yes {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .btn-yes:hover, .btn-yes:focus-visible {
    background: var(--accent-h); border-color: var(--accent-h); outline: none;
  }
  .btn-no {
    background: transparent; color: var(--text); border-color: var(--border);
  }
  .btn-no:hover, .btn-no:focus-visible {
    background: var(--bg); border-color: var(--muted); outline: none;
  }

  /* ── Response message ── */
  .msg-box {
    border-radius: 12px;
    padding: 18px 16px;
    border: 1px solid;
    font-size: 14px; line-height: 1.65;
  }
  .msg-box p { margin: 0 0 10px; }
  .msg-box p:last-child { margin-bottom: 0; }
  .msg-box strong { font-weight: 700; }

  .msg-head {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.09em; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .msg-head svg { flex-shrink: 0; }

  .msg-yes  { background: var(--msg-yes-bg);  border-color: var(--msg-yes-bd);  color: var(--msg-yes-tx);  }
  .msg-warn { background: var(--msg-warn-bg); border-color: var(--msg-warn-bd); color: var(--msg-warn-tx); }
  .msg-blue { background: var(--msg-blue-bg); border-color: var(--msg-blue-bd); color: var(--msg-blue-tx); }
  .msg-grey { background: var(--msg-grey-bg); border-color: var(--msg-grey-bd); color: var(--msg-grey-tx); }

  /* ── Notify link ── */
  .notify-btn {
    display: inline-flex; align-items: center; gap: 7px;
    margin-top: 16px; padding: 9px 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 8px;
    font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--accent); text-decoration: none;
    cursor: pointer; transition: background 0.12s;
  }
  .notify-btn:hover { background: var(--bg); }

  .thank-note {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
    margin-top: 12px;
  }

  /* ── No-params state ── */
  .no-params {
    text-align: center; padding: 10px 0;
    color: var(--muted);
  }
  .no-params p { font-size: 14px; margin: 0 0 6px; line-height: 1.55; }
  .no-params a { color: var(--accent); }

  /* ── Footer ── */
  .footer {
    font-size: 12px; color: var(--muted);
    text-align: center; line-height: 1.5;
  }
  .footer a { color: var(--muted); }

  @media (max-width: 400px) {
    .card { padding: 20px 16px; }
    .btn-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="header">
      <div class="logo-mark">ROW</div>
      <div>
        <div class="club-name">ROW Swimming</div>
        <div class="club-sub">Laurier Athletics · Card Check-In</div>
      </div>
    </div>
    <div id="content"></div>
  </div>
  <div class="footer">
    ROW Swim Club · <a href="https://rowswimming.ca">rowswimming.ca</a>
  </div>
</div>

<script>
  const p     = new URLSearchParams(location.search);
  const fn    = (p.get('fn')     || '').trim();
  const stat  = (p.get('status') || 'former').trim().toLowerCase();
  const raw   = (p.get('cards')  || '').trim();
  const isCur = stat === 'current';

  // Parse "Swimmer Name [CardID]" entries, separated by | or "],"
  function parseCards(str) {
    if (!str) return [];
    // split on | or on ], then add ] back to each chunk
    const chunks = str.includes('|')
      ? str.split('|')
      : str.split('],').map((s, i, a) => i < a.length - 1 ? s.trim() + ']' : s.trim());
    return chunks.flatMap(chunk => {
      const m = chunk.trim().match(/^(.+?)\s*\[([^\]]+)\]\s*$/);
      if (m) return [{ name: m[1].trim(), id: m[2].trim() }];
      if (chunk.trim()) return [{ name: chunk.trim(), id: '' }];
      return [];
    });
  }

  const cards  = parseCards(raw);
  const plural = cards.length !== 1;

  function buildMailto(hasCard) {
    const list = cards.map(c => c.id ? c.name + ' [' + c.id + ']' : c.name).join(', ') || '(see account)';
    const subj = encodeURIComponent('Laurier Card Response — ' + (fn || 'Account Holder'));
    const body = encodeURIComponent(
      'Hi Andrew,\n\n'
      + (fn || 'The account holder') + ' has confirmed: '
      + (hasCard ? 'Yes, I have my card(s) in my possession.' : 'No, I no longer have my card(s).')
      + '\n\nCards: ' + list
      + '\nMember status: ' + (isCur ? 'Current ROW member' : 'Former ROW member')
      + '\n\nThank you.'
    );
    return 'mailto:andrewmoss@rowswimming.ca?subject=' + subj + '&body=' + body;
  }

  // SVG icons
  function iconCheck() {
    return '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8"/><polyline points="6.5,10.5 9,13 13.5,7"/></svg>';
  }
  function iconInfo() {
    return '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><line x1="10" y1="9" x2="10" y2="14"/><circle cx="10" cy="6.2" r="0.8" fill="currentColor" stroke="none"/></svg>';
  }
  function iconReturn() {
    return '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h9a4 4 0 0 0 0-8H6"/><polyline points="7,6 4,10 7,14"/></svg>';
  }
  function iconWave() {
    return '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 14c3-5 11-5 14 0"/><path d="M3 6c3 5 11 5 14 0"/></svg>';
  }
  function iconMail() {
    return '<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="16" height="13" rx="2"/><polyline points="2,4 10,12 18,4"/></svg>';
  }
  function iconTick() {
    return '<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,10 8,14 16,6"/></svg>';
  }

  const MSGS = {
    'yes-current': {
      cls: 'msg-yes', icon: iconCheck(), label: 'Great news',
      body: '<p>Please hold onto your card' + (plural ? 's' : '') + ' — we’ll be in touch once ' + (plural ? 'they’ve' : 'it’s') + ' been reactivated for the <strong>2026–27 season</strong>.</p>'
    },
    'no-current': {
      cls: 'msg-warn', icon: iconInfo(), label: 'Noted',
      body: '<p>We’ll arrange replacement card' + (plural ? 's' : '') + ' for your account. Please note that Wilfrid Laurier values these cards at <strong>$30 each</strong>.</p>'
           + '<p>We will replace swimmer cards at <strong>no charge</strong>. More information on accessing additional cards will follow.</p>'
    },
    'yes-former': {
      cls: 'msg-blue', icon: iconReturn(), label: 'Thank you',
      body: '<p>If you’re able to, please <strong>return the card' + (plural ? 's' : '') + '</strong> to the front desk of the <strong>Laurier Athletics Complex</strong>.</p>'
           + '<p>Just let them know you’re returning an old ROW Swimming access card. We really appreciate it!</p>'
    },
    'no-former': {
      cls: 'msg-grey', icon: iconWave(), label: 'Thank you',
      body: '<p>We appreciate you taking the time to help us out.</p><p>We wish you all the best!</p>'
    }
  };

  function respond(hasCard) {
    const key = (hasCard ? 'yes' : 'no') + '-' + (isCur ? 'current' : 'former');
    const msg = MSGS[key];
    document.getElementById('q-section').hidden = true;
    const r = document.getElementById('r-section');
    r.innerHTML =
      '<div class="msg-box ' + msg.cls + '">'
        + '<div class="msg-head">' + msg.icon + msg.label + '</div>'
        + msg.body
        + '<a class="notify-btn" href="' + buildMailto(hasCard) + '">'
        + iconMail() + 'Send us a quick confirmation'
        + '</a>'
      + '</div>'
      + '<div class="thank-note">'
        + iconTick()
        + 'Response noted — thank you' + (fn ? ', ' + fn : '') + '!'
      + '</div>';
    r.hidden = false;
  }

  // Build page
  const content = document.getElementById('content');

  if (!fn && cards.length === 0) {
    content.innerHTML =
      '<div class="no-params">'
      + '<p>Please use the personalized link from your email to access this form.</p>'
      + '<p style="font-size:12px">Questions? Contact us at <a href="mailto:andrewmoss@rowswimming.ca">andrewmoss@rowswimming.ca</a>.</p>'
      + '</div>';
  } else {
    const cardRows = cards.map((c, i) =>
      '<div class="card-row">'
      + '<span class="swimmer">' + c.name + '</span>'
      + (c.id ? '<span class="cid">' + c.id + '</span>' : '')
      + '</div>'
    ).join('');

    content.innerHTML =
      '<p class="greeting">Hi' + (fn ? ' ' + fn : '') + ',</p>'
      + '<p class="context">We’re checking in about your Wilfrid Laurier Athletics access card'
      + (plural ? 's' : '') + ' associated with your ROW Swimming account.</p>'
      + (cardRows ? '<div class="cards-box"><div class="cards-label">Your card' + (plural ? 's' : '') + '</div>' + cardRows + '</div>' : '')
      + '<div id="q-section">'
        + '<p class="question">Do you still have ' + (plural ? 'these cards' : 'this card') + ' in your possession?</p>'
        + '<div class="btn-row">'
          + '<button class="btn btn-yes" onclick="respond(true)">Yes, I have ' + (plural ? 'them' : 'it') + '</button>'
          + '<button class="btn btn-no" onclick="respond(false)">No, I don’t</button>'
        + '</div>'
      + '</div>'
      + '<div id="r-section" hidden></div>';
  }
</script>
</body>
</html>
