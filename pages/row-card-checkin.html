<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ROW Card Check-In</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap">
  <style>
  :root {
    --bg:       #EAF3FC;
    --surface:  #FFFFFF;
    --border:   #C2D9EE;
    --text:     #0C1E30;
    --muted:    #5A7890;
    --accent:   #1676C2;
    --accent-h: #1260A4;

    --have-bg: #E6F5EE; --have-bd: #2E9E5A; --have-tx: #124C2C;
    --lost-bg: #FEF4E4; --lost-bd: #D4860A; --lost-tx: #78410A;

    --msg-yes-bg:   #E6F5EE; --msg-yes-bd:   #9ECFB2; --msg-yes-tx:   #124C2C;
    --msg-warn-bg:  #FEF4E4; --msg-warn-bd:  #F0C276; --msg-warn-tx:  #78410A;
    --msg-blue-bg:  #E4EFFD; --msg-blue-bd:  #9AB8F0; --msg-blue-tx:  #1B3478;
    --msg-grey-bg:  #F2F5F8; --msg-grey-bd:  #C8D4E0; --msg-grey-tx:  #3C4F62;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:       #081524;
      --surface:  #0E2030;
      --border:   #1E3A55;
      --text:     #DCEEFA;
      --muted:    #6898B8;
      --accent:   #48A6DE;
      --accent-h: #5BB4E8;

      --have-bg: #092A18; --have-bd: #1D7040; --have-tx: #6EDAA0;
      --lost-bg: #281A07; --lost-bd: #9A5D0A; --lost-tx: #F5C87A;

      --msg-yes-bg:   #092A18; --msg-yes-bd:   #185A34; --msg-yes-tx:   #6EDAA0;
      --msg-warn-bg:  #281A07; --msg-warn-bd:  #7A4B10; --msg-warn-tx:  #F5C87A;
      --msg-blue-bg:  #0B1C44; --msg-blue-bd:  #253880; --msg-blue-tx:  #A4B8F8;
      --msg-grey-bg:  #131E2C; --msg-grey-bd:  #28394E; --msg-grey-tx:  #90A8BC;
    }
  }
  :root[data-theme="dark"] {
    --bg:       #081524;
    --surface:  #0E2030;
    --border:   #1E3A55;
    --text:     #DCEEFA;
    --muted:    #6898B8;
    --accent:   #48A6DE;
    --accent-h: #5BB4E8;

    --have-bg: #092A18; --have-bd: #1D7040; --have-tx: #6EDAA0;
    --lost-bg: #281A07; --lost-bd: #9A5D0A; --lost-tx: #F5C87A;

    --msg-yes-bg:   #092A18; --msg-yes-bd:   #185A34; --msg-yes-tx:   #6EDAA0;
    --msg-warn-bg:  #281A07; --msg-warn-bd:  #7A4B10; --msg-warn-tx:  #F5C87A;
    --msg-blue-bg:  #0B1C44; --msg-blue-bd:  #253880; --msg-blue-tx:  #A4B8F8;
    --msg-grey-bg:  #131E2C; --msg-grey-bd:  #28394E; --msg-grey-tx:  #90A8BC;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: 'Nunito Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 28px 16px 48px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .wrap {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 26px 24px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 18px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .logo-mark {
    width: 36px; height: 36px;
    background: var(--accent);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .club-name {
    font-size: 12px; font-weight: 800;
    color: var(--text); letter-spacing: 0.07em;
    text-transform: uppercase; line-height: 1.2;
  }
  .club-sub { font-size: 11px; color: var(--muted); font-weight: 400; }

  /* ── Greeting ── */
  .greeting {
    font-size: 21px; font-weight: 800;
    margin: 0 0 8px; line-height: 1.3;
    text-wrap: balance;
  }
  .context {
    font-size: 14px; color: var(--muted);
    line-height: 1.65; margin: 0 0 22px;
  }

  /* ── Section label ── */
  .section-label {
    font-size: 10px; font-weight: 800;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
  }

  /* ── Per-card rows ── */
  .cards-list {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin-bottom: 24px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .card-check-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .card-check-row:last-child { border-bottom: none; }

  .card-info { flex: 1; min-width: 0; }
  .swimmer-name {
    font-size: 14px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cid {
    font-family: 'Courier New', monospace;
    font-size: 11px; font-weight: 700;
    color: var(--accent);
    margin-top: 2px;
  }

  /* ── Toggle buttons ── */
  .card-toggle {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .tog {
    padding: 7px 14px;
    border-radius: 8px;
    border: 2px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: all 0.12s ease;
    white-space: nowrap;
  }
  .tog:hover { border-color: var(--muted); color: var(--text); }

  .tog.have-sel {
    background: var(--have-bg);
    border-color: var(--have-bd);
    color: var(--have-tx);
  }
  .tog.lost-sel {
    background: var(--lost-bg);
    border-color: var(--lost-bd);
    color: var(--lost-tx);
  }

  /* ── Progress hint ── */
  .progress-hint {
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 20px;
    min-height: 20px;
    transition: color 0.2s;
  }
  .progress-hint.ready { color: var(--accent); font-weight: 700; }

  /* ── Submit button ── */
  .submit-wrap {
    margin-top: 4px;
  }
  .submit-btn {
    width: 100%;
    padding: 18px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 14px;
    font-family: inherit;
    font-size: 18px; font-weight: 800;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 4px 18px rgba(22, 118, 194, 0.35);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .submit-btn:not(:disabled):hover {
    background: var(--accent-h);
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(22, 118, 194, 0.45);
  }
  .submit-btn:not(:disabled):active {
    transform: translateY(0);
    box-shadow: 0 2px 10px rgba(22, 118, 194, 0.3);
  }
  .submit-btn:disabled {
    opacity: 0.32;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ── Response section ── */
  .response-section { display: flex; flex-direction: column; gap: 12px; }

  .msg-box {
    border-radius: 12px;
    padding: 18px 16px;
    border: 1px solid;
    font-size: 14px; line-height: 1.65;
  }
  .msg-box p { margin: 0 0 10px; }
  .msg-box p:last-child { margin-bottom: 0; }
  .msg-box strong { font-weight: 700; }
  .msg-box ul { margin: 8px 0 10px 20px; padding: 0; }
  .msg-box li { margin-bottom: 4px; }

  .msg-head {
    display: flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 800;
    letter-spacing: 0.09em; text-transform: uppercase;
    margin-bottom: 10px;
  }
  .msg-head svg { flex-shrink: 0; }

  .msg-yes  { background: var(--msg-yes-bg);  border-color: var(--msg-yes-bd);  color: var(--msg-yes-tx);  }
  .msg-warn { background: var(--msg-warn-bg); border-color: var(--msg-warn-bd); color: var(--msg-warn-tx); }
  .msg-blue { background: var(--msg-blue-bg); border-color: var(--msg-blue-bd); color: var(--msg-blue-tx); }
  .msg-grey { background: var(--msg-grey-bg); border-color: var(--msg-grey-bd); color: var(--msg-grey-tx); }


  .thank-note {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
  }

  /* ── No-params state ── */
  .no-params {
    text-align: center; padding: 10px 0;
    color: var(--muted);
  }
  .no-params p { font-size: 14px; margin: 0 0 6px; line-height: 1.55; }
  .no-params a { color: var(--accent); }

  /* ── Footer ── */
  .footer {
    font-size: 12px; color: var(--muted);
    text-align: center; line-height: 1.5;
  }
  .footer a { color: var(--muted); }

  @media (max-width: 420px) {
    .card { padding: 20px 16px; }
    .tog { padding: 6px 10px; font-size: 12px; }
    .submit-btn { font-size: 16px; padding: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="header">
      <div class="logo-mark">ROW</div>
      <div>
        <div class="club-name">ROW Swimming</div>
        <div class="club-sub">Laurier Athletics · Card Check-In</div>
      </div>
    </div>
    <div id="content"></div>
  </div>
  <div class="footer">
    ROW Swim Club · <a href="https://rowswimming.ca">rowswimming.ca</a>
  </div>
</div>

<script>
  const p    = new URLSearchParams(location.search);
  const fn   = (p.get('fn')     || '').trim();
  const stat = (p.get('status') || 'former').trim().toLowerCase();
  const raw  = (p.get('cards')  || '').trim();
  const isCur = stat === 'current';

  function parseCards(str) {
    if (!str) return [];
    return str.split('|').flatMap(chunk => {
      const m = chunk.trim().match(/^(.+?)\s*\[([^\]]+)\]\s*$/);
      if (m) return [{ name: m[1].trim(), id: m[2].trim() }];
      if (chunk.trim()) return [{ name: chunk.trim(), id: '' }];
      return [];
    });
  }

  const cards = parseCards(raw);
  const answers = new Array(cards.length).fill(null); // null | true | false

  // ── Icons ──────────────────────────────────────────────────────────────────
  const iconCheck = () => '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="8"/><polyline points="6.5,10.5 9,13 13.5,7"/></svg>';
  const iconInfo  = () => '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><line x1="10" y1="9" x2="10" y2="14"/><circle cx="10" cy="6.2" r="0.8" fill="currentColor" stroke="none"/></svg>';
  const iconReturn= () => '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h9a4 4 0 0 0 0-8H6"/><polyline points="7,6 4,10 7,14"/></svg>';
  const iconWave  = () => '<svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 14c3-5 11-5 14 0"/><path d="M3 6c3 5 11 5 14 0"/></svg>';
  const iconTick  = () => '<svg width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,10 8,14 16,6"/></svg>';
  const iconArrow = () => '<svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="10" x2="16" y2="10"/><polyline points="11,5 16,10 11,15"/></svg>';

  // ── Toggle a card's answer ─────────────────────────────────────────────────
  function pick(idx, hasIt) {
    answers[idx] = hasIt;
    // Update button states
    const row = document.getElementById('row-' + idx);
    row.querySelector('.tog-yes').classList.toggle('have-sel', hasIt === true);
    row.querySelector('.tog-no').classList.toggle('lost-sel', hasIt === false);
    updateProgress();
  }

  function updateProgress() {
    const answered = answers.filter(a => a !== null).length;
    const total    = cards.length;
    const hint     = document.getElementById('progress-hint');
    const btn      = document.getElementById('submit-btn');
    const allDone  = answered === total;

    if (allDone) {
      hint.textContent = 'All cards answered — ready to submit!';
      hint.className   = 'progress-hint ready';
    } else {
      hint.textContent = answered + ' of ' + total + ' card' + (total === 1 ? '' : 's') + ' answered';
      hint.className   = 'progress-hint';
    }
    btn.disabled = !allDone;
  }

  // ── POST to Google Sheet via Apps Script ──────────────────────────────────
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx9fotmiQOHDvq1VR0kWKKz_GTkfB4Ph7XKh1-ruw7XWz8EjWeyNhY5b_JDIrDnnA80nQ/exec';

  function postToSheet(cardResults) {
    if (!SCRIPT_URL || SCRIPT_URL.startsWith('PASTE')) return;
    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ fn: fn, status: stat, cards: cardResults }),
      mode: 'no-cors' // Apps Script doesn't return CORS headers on redirects
    }).catch(() => {}); // silent fail — response still shown to member
  }

  // ── Show response after submit ─────────────────────────────────────────────
  function submit() {
    const haveList = cards.filter((_, i) => answers[i] === true);
    const lostList = cards.filter((_, i) => answers[i] === false);

    // POST results to Google Sheet
    const cardResults = cards.map((c, i) => ({ name: c.name, id: c.id, has: answers[i] }));
    postToSheet(cardResults);
    const allHave  = lostList.length === 0;
    const allLost  = haveList.length === 0;

    document.getElementById('q-section').hidden = true;

    let blocks = [];

    if (isCur) {
      if (haveList.length) {
        const names = haveList.map(c => '<li>' + c.name + (c.id ? ' <span style="font-family:\'Courier New\',monospace;font-size:12px;font-weight:700">[' + c.id + ']</span>' : '') + '</li>').join('');
        blocks.push('<div class="msg-box msg-yes">'
          + '<div class="msg-head">' + iconCheck() + 'Great — hold onto ' + (haveList.length === 1 ? 'it' : 'these') + '</div>'
          + '<p>We\'ll reactivate ' + (haveList.length === 1 ? 'this card' : 'these cards') + ' for the <strong>2026–27 season</strong>. Keep ' + (haveList.length === 1 ? 'it' : 'them') + ' safe!</p>'
          + '<ul>' + names + '</ul>'
          + '</div>');
      }
      if (lostList.length) {
        const names = lostList.map(c => '<li>' + c.name + (c.id ? ' <span style="font-family:\'Courier New\',monospace;font-size:12px;font-weight:700">[' + c.id + ']</span>' : '') + '</li>').join('');
        blocks.push('<div class="msg-box msg-warn">'
          + '<div class="msg-head">' + iconInfo() + 'Noted — ' + (lostList.length === 1 ? 'card' : 'cards') + ' to replace</div>'
          + '<p>We\'ll arrange replacement' + (lostList.length === 1 ? ' a replacement card' : ' replacement cards') + ' for:</p>'
          + '<ul>' + names + '</ul>'
          + '<p>Laurier values these cards at <strong>$30 each</strong>. We will replace swimmer cards at <strong>no charge</strong> — more details to follow.</p>'
          + '</div>');
      }
    } else {
      if (haveList.length) {
        const names = haveList.map(c => '<li>' + c.name + (c.id ? ' <span style="font-family:\'Courier New\',monospace;font-size:12px;font-weight:700">[' + c.id + ']</span>' : '') + '</li>').join('');
        blocks.push('<div class="msg-box msg-blue">'
          + '<div class="msg-head">' + iconReturn() + 'Please return ' + (haveList.length === 1 ? 'this card' : 'these cards') + '</div>'
          + '<p>Drop ' + (haveList.length === 1 ? 'it' : 'them') + ' off at the front desk of the <strong>Laurier Athletics Complex</strong> and let staff know you\'re returning an old ROW Swimming access card.</p>'
          + '<ul>' + names + '</ul>'
          + '</div>');
      }
      if (lostList.length) {
        blocks.push('<div class="msg-box msg-grey">'
          + '<div class="msg-head">' + iconWave() + 'Thanks for letting us know</div>'
          + '<p>We appreciate you taking the time. We wish you all the best!</p>'
          + '</div>');
      }
    }

    blocks.push(
      '<div class="thank-note">' + iconTick() + 'Response noted — thank you' + (fn ? ', ' + fn : '') + '!</div>'
    );

    const r = document.getElementById('r-section');
    r.innerHTML = '<div class="response-section">' + blocks.join('') + '</div>';
    r.hidden = false;
  }

  // ── Build page ────────────────────────────────────────────────────────────
  const content = document.getElementById('content');

  if (!fn && cards.length === 0) {
    content.innerHTML =
      '<div class="no-params">'
      + '<p>Please use the personalized link from your email to access this form.</p>'
      + '<p style="font-size:12px">Questions? <a href="mailto:andrewmoss@rowswimming.ca">andrewmoss@rowswimming.ca</a></p>'
      + '</div>';
  } else {
    const plural = cards.length !== 1;

    const cardRows = cards.map((c, i) =>
      '<div class="card-check-row" id="row-' + i + '">'
      + '<div class="card-info">'
        + '<div class="swimmer-name">' + c.name + '</div>'
        + (c.id ? '<div class="cid">Card #' + c.id + '</div>' : '')
      + '</div>'
      + '<div class="card-toggle">'
        + '<button class="tog tog-yes" onclick="pick(' + i + ', true)">✓ Have it</button>'
        + '<button class="tog tog-no"  onclick="pick(' + i + ', false)">✗ Lost it</button>'
      + '</div>'
      + '</div>'
    ).join('');

    content.innerHTML =
      '<p class="greeting">Hi' + (fn ? ', ' + fn : '') + '!</p>'
      + '<p class="context">We\'re checking in about your Wilfrid Laurier Athletics access card'
        + (plural ? 's' : '') + ' linked to your ROW Swimming account. Please confirm each card below.</p>'
      + '<div id="q-section">'
        + '<div class="section-label">Your card' + (plural ? 's' : '') + ' — do you still have ' + (plural ? 'them' : 'it') + '?</div>'
        + '<div class="cards-list">' + cardRows + '</div>'
        + '<p class="progress-hint" id="progress-hint">'
          + '0 of ' + cards.length + ' card' + (plural ? 's' : '') + ' answered'
        + '</p>'
        + '<div class="submit-wrap">'
          + '<button class="submit-btn" id="submit-btn" onclick="submit()" disabled>'
            + iconArrow() + 'Submit My Answers'
          + '</button>'
        + '</div>'
      + '</div>'
      + '<div id="r-section" hidden></div>';
  }
</script>
</body>
</html>
